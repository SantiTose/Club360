{% extends "base.html" %}

{% block title %}Recuperar Contraseña - Club 360{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Recuperar Contraseña</h2>

        <form method="POST" class="form" novalidate>
            <div class="form-group">
                <label for="email">Ingresa tu email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control {% if field_errors.get('email') %}is-invalid{% endif %}"
                    value="{{ form_data.get('email', '') }}"
                    required
                >
                {% if field_errors.get('email') %}<small class="form-text error">{{ field_errors['email'] }}</small>{% endif %}
            </div>

            <button type="submit" class="btn btn-primary">Recuperar</button>
        </form>

        <p><a href="{{ url_for('auth.login') }}">Volver a Iniciar Sesión</a></p>
    </div>
</div>
{% endblock %}

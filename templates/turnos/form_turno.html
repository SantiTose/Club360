{% extends "base.html" %}

{% block title %}{{ 'Editar Turno' if turno else 'Crear Clase' }} - Club 360{% endblock %}

{% block content %}
<section class="calendar-page">
    <div class="calendar-page-header">
        <div>
            <h2>{{ 'Editar Turno' if turno else 'Crear Clase' }}</h2>
        </div>
    </div>

    <div class="calendar-form-card">
        <form method="POST" class="form"{% if turno %} data-confirm="true" data-confirm-title="Guardar cambios" data-confirm-message="Se actualizará la información del turno seleccionado." data-confirm-action="Guardar"{% endif %}>
            <div class="form-group-row">
                <div class="form-group">
                    <label>Actividad</label>
                    <select name="actividad" class="form-control" required>
                        <option value="futbol" {% if turno and turno.actividad == 'futbol' %}selected{% endif %}>Fútbol</option>
                        <option value="basquet" {% if turno and turno.actividad == 'basquet' %}selected{% endif %}>Básquet</option>
                        <option value="voley" {% if turno and turno.actividad == 'voley' %}selected{% endif %}>Vóley</option>
                        <option value="padel" {% if turno and turno.actividad == 'padel' %}selected{% endif %}>Pádel</option>
                    </select>
                </div>
                <div class="form-group">
                    {% if turno %}
                    <label>Fecha</label>
                    <input type="text" name="fecha" class="form-control js-date-input" inputmode="numeric" autocomplete="off" placeholder="dd/mm/yyyy" maxlength="10" pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{4}" value="{{ turno.hora_inicio.strftime('%d/%m/%Y') }}" required>
                    {% else %}
                    <label>Día</label>
                    <select name="dia_semana" class="form-control" required>
                        <option value="">Seleccionar día</option>
                        {% for valor, nombre in dias_semana %}
                        <option value="{{ valor }}">{{ nombre|capitalize }}</option>
                        {% endfor %}
                    </select>
                    {% endif %}
                </div>
                <div class="form-group">
                    <label>Horario</label>
                    <select name="hora_inicio_slot" class="form-control" required>
                        <option value="">Seleccionar horario</option>
                        {% for hora in horas_disponibles %}
                        {% set valor = '%02d'|format(hora) %}
                        {% set seleccionado = (turno and turno.hora_inicio.hour == hora) %}
                        <option value="{{ hora }}" {% if seleccionado %}selected{% endif %}>{{ valor }}:00 - {{ '%02d'|format(hora + 1) }}:00</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Capacidad máxima</label>
                <input type="number" name="capacidad_maxima" min="1" class="form-control" value="{{ turno.capacidad_maxima if turno else '' }}" required>
            </div>

            <div class="button-group" style="justify-content: flex-start;">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{{ url_for('turnos.administrar_turnos') }}" class="btn btn-secondary">Volver</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
